# Frontier API + local GPU pricing used by evaluation/eval_harness.py
# and evaluation/cost_model_helpers.py.
#
# Rates are approximate USD list prices for cost-model spreadsheet feeds.
# Update when OpenRouter / provider pricing changes.
#
# This file is auto-created by evaluation.cost_model_helpers.ensure_pricing_yaml()
# if missing; committed defaults should stay in sync with OpenRouter list prices.

frontier_models:
  anthropic:
    # anthropic/claude-sonnet-4.5 via OpenRouter (approx.)
    input_per_million: 3.00
    output_per_million: 15.00
  openai:
    # openai/gpt-4o via OpenRouter (approx.)
    input_per_million: 2.50
    output_per_million: 10.00

# Vision classification Braintrust experiments (OpenRouter list prices; update often).
# Used by src.braintrust_eval.cost_estimate. Cached input rate falls back to
# input_per_million when omitted.
braintrust_vision_models:
  moonshotai/kimi-k3:
    # User-reported experiment rates ($0.30 / $15). Confirm against OpenRouter.
    input_per_million: 0.30
    output_per_million: 15.00
    cached_input_per_million: 0.30
  deepseek/deepseek-r1:
    input_per_million: 0.55
    output_per_million: 2.19
  anthropic/claude-sonnet-4.5:
    input_per_million: 3.00
    output_per_million: 15.00
  anthropic/claude-opus-4.5:
    input_per_million: 15.00
    output_per_million: 75.00
  openai/gpt-4o:
    input_per_million: 2.50
    output_per_million: 10.00

local_compute:
  # Amortized fully-loaded cost of a single consumer/pro GPU hour used for
  # local classifier / extractor / LoRA memo inference. Tune to your hardware.
  gpu_hourly_rate_usd: 0.80
  # Peak / reference throughput (docs per hour) for spreadsheet steady-state $/doc.
  # Distinct from per-call latency amortization used by the eval harness.
  reference_docs_per_hour:
    classification: 12000
    extraction: 2400
    memo_generation: 180
